name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Elm and elm-test
        run: npm install -g elm@0.19.1-6 elm-test@0.19.1-revision12
      - name: Build package and documentation
        run: elm make --docs=docs.json
      - name: Semantic tests
        run: elm-test
